name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build, Audit and Test
    runs-on: ubuntu-latest
    
    env:
      MIX_ENV: test

    defaults:
      run:
        working-directory: ./alva

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.20.2'
        otp-version: '28'

    - name: Cache dependencies and PLTs
      uses: actions/cache@v4
      with:
        path: |
          alva/deps
          alva/_build
        key: ${{ runner.os }}-mix-${{ hashFiles('alva/**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-

    - name: Install dependencies
      run: mix deps.get

    - name: Check code formatting
      run: mix format --check-formatted

    - name: Compile with warnings as errors
      run: mix compile --warnings-as-errors

    - name: Run Static Security Audit (Sobelow)
      run: mix sobelow

    - name: Run Static Type Checker (Dialyzer)
      run: mix dialyzer

    - name: Run tests and coverage
      run: mix coveralls
